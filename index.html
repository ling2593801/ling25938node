<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>唯美写真相册</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }
    body{
      font-family:Arial,"Microsoft YaHei";
      background:#111;
      color:#fff;
      padding:20px;
      min-height:100vh;
    }
    .title{
      text-align:center;
      font-size:28px;
      margin:30px 0;
      color:#f7c9d5;
      text-shadow:0 0 10px rgba(255,185,205,0.5);
    }
    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
      gap:20px;
      max-width:1400px;
      margin:0 auto;
    }
    .item{
      height:450px;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 8px 20px rgba(0,0,0,0.6);
      transition:all 0.3s ease;
      position:relative;
    }
    .item:hover{
      transform:scale(1.03);
      box-shadow:0 12px 30px rgba(255,167,191,0.2);
    }
    .item img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .empty-tip{
      text-align:center;
      padding:40px;
      color:#aaa;
      font-size:16px;
    }
  </style>
</head>
<body>
  <h1 class="title">唯美美女写真相册</h1>
  <div class="gallery">
    <div class="item"><img src="https://picsum.photos/id/1027/600/900" alt="美女"></div>
    <div class="item"><img src="https://picsum.photos/id/1011/600/900" alt="美女"></div>
    <div class="item"><img src="https://picsum.photos/id/1014/600/900" alt="美女"></div>
    <div class="item"><img src="https://picsum.photos/id/1062/600/900" alt="美女"></div>
    <div class="item"><img src="https://picsum.photos/id/1074/600/900" alt="美女"></div>
    <div class="item"><img src="https://picsum.photos/id/1084/600/900" alt="美女"></div>
  </div>
</body>
</html>
